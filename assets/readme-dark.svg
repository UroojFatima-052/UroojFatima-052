<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace">
  <style>
    .txt { fill: #c9d1d9; font-size: 16px; }
    .mut { fill: #7d8590; font-size: 16px; }
    .dot { fill: #30363d; font-size: 16px; }
    .kw { fill: #7dcfff; font-size: 16px; }
    .pur { fill: #bb9af7; font-size: 16px; }
    .pnk { fill: #f7768e; font-size: 16px; }
    .gry { fill: #8b949e; font-size: 16px; }
    .str { fill: #9ece6a; font-size: 16px; }
    .chip { font-size: 14px; font-weight: 500; }
  </style>

  <rect width="900" height="1420" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="0.5"/>

  <text x="450" y="50" class="dot" text-anchor="middle">·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·</text>

  <g font-size="52" font-weight="500" text-anchor="middle">
    <text x="450" y="145">
      <tspan fill="#bb9af7">&gt;&gt;&gt;</tspan>
      <tspan fill="#f7768e"> import</tspan>
      <tspan fill="#c9d1d9"> self</tspan>
    </text>
  </g>
  <text x="450" y="195" font-size="20" fill="#7d8590" text-anchor="middle" font-style="italic">a software engineer, self-imported</text>

  <text x="450" y="240" class="dot" text-anchor="middle">·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·</text>

  <g xml:space="preserve">
    <text x="80" y="295" class="str">"""</text>
    <text x="80" y="325"><tspan class="pnk">    ✿</tspan><tspan class="txt">  Glad you're here.</tspan></text>
    <text x="80" y="385"><tspan class="txt">       I write code that tries to make small things</tspan></text>
    <text x="80" y="415"><tspan class="txt">       a little better for the people who use them.</tspan></text>
    <text x="80" y="445"><tspan class="txt">       Some of it lives on this profile. A lot of it</tspan></text>
    <text x="80" y="475"><tspan class="txt">       doesn't — yet.</tspan></text>
    <text x="80" y="535"><tspan class="txt">       If you build something, I'd love to see it.</tspan></text>
    <text x="80" y="565"><tspan class="txt">       If you're stuck, tell me — I'll sit with you</tspan></text>
    <text x="80" y="595"><tspan class="txt">       while we figure it out.</tspan></text>
    <text x="80" y="655"><tspan class="dot">    ─── ・ 。゚☆: *.☽ .* :☆゚. ───</tspan></text>
    <text x="80" y="715"><tspan class="kw">    :dependencies:</tspan></text>
  </g>

  <text x="80" y="775" xml:space="preserve"><tspan class="pur">    ◆  languages</tspan></text>
  <g transform="translate(120, 790)">
    <rect x="0" y="0" width="72" height="26" rx="5" fill="#3d3617"/>
    <text x="36" y="18" fill="#e0af68" text-anchor="middle" class="chip">python</text>
    <rect x="82" y="0" width="96" height="26" rx="5" fill="#3d2a17"/>
    <text x="130" y="18" fill="#e8945a" text-anchor="middle" class="chip">javascript</text>
    <rect x="188" y="0" width="46" height="26" rx="5" fill="#0f2b47"/>
    <text x="211" y="18" fill="#7dcfff" text-anchor="middle" class="chip">sql</text>
  </g>

  <text x="80" y="850" xml:space="preserve"><tspan class="kw">    ◆  backend</tspan></text>
  <g transform="translate(120, 865)">
    <rect x="0" y="0" width="60" height="26" rx="5" fill="#0f2b47"/>
    <text x="30" y="18" fill="#7dcfff" text-anchor="middle" class="chip">flask</text>
    <rect x="70" y="0" width="76" height="26" rx="5" fill="#0f2b47"/>
    <text x="108" y="18" fill="#7dcfff" text-anchor="middle" class="chip">fastapi</text>
    <rect x="156" y="0" width="90" height="26" rx="5" fill="#0f2b47"/>
    <text x="201" y="18" fill="#7dcfff" text-anchor="middle" class="chip">rest apis</text>
  </g>

  <text x="80" y="925" xml:space="preserve"><tspan class="pnk">    ◆  ai / ml</tspan></text>
  <g transform="translate(120, 940)">
    <rect x="0" y="0" width="108" height="26" rx="5" fill="#3d1a2a"/>
    <text x="54" y="18" fill="#f7768e" text-anchor="middle" class="chip">scikit-learn</text>
    <rect x="118" y="0" width="76" height="26" rx="5" fill="#3d1a2a"/>
    <text x="156" y="18" fill="#f7768e" text-anchor="middle" class="chip">pytorch</text>
    <rect x="204" y="0" width="104" height="26" rx="5" fill="#3d1a2a"/>
    <text x="256" y="18" fill="#f7768e" text-anchor="middle" class="chip">huggingface</text>
  </g>

  <text x="80" y="1000" xml:space="preserve"><tspan class="gry">    ◆  tools</tspan></text>
  <g transform="translate(120, 1015)">
    <rect x="0" y="0" width="70" height="26" rx="5" fill="#21262d"/>
    <text x="35" y="18" fill="#c9d1d9" text-anchor="middle" class="chip">vscode</text>
    <rect x="80" y="0" width="42" height="26" rx="5" fill="#21262d"/>
    <text x="101" y="18" fill="#c9d1d9" text-anchor="middle" class="chip">git</text>
    <rect x="132" y="0" width="70" height="26" rx="5" fill="#21262d"/>
    <text x="167" y="18" fill="#c9d1d9" text-anchor="middle" class="chip">docker</text>
    <rect x="212" y="0" width="58" height="26" rx="5" fill="#21262d"/>
    <text x="241" y="18" fill="#c9d1d9" text-anchor="middle" class="chip">linux</text>
  </g>

  <g xml:space="preserve">
    <text x="80" y="1105"><tspan class="dot">    ─── ・ 。゚☆: *.☽ .* :☆゚. ───</tspan></text>
    <text x="80" y="1165"><tspan class="kw">    :author:   </tspan><tspan class="txt">the person on the other side of this</tspan></text>
    <text x="80" y="1195"><tspan class="kw">    :version:  </tspan><tspan class="txt">still learning, always</tspan></text>
    <text x="80" y="1225"><tspan class="kw">    :license:  </tspan><tspan class="txt">be kind</tspan></text>
    <text x="80" y="1255" class="str">"""</text>
  </g>

  <text x="450" y="1305" class="dot" text-anchor="middle">·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·</text>

  <g font-size="18" text-anchor="middle">
    <text x="450" y="1345">
      <tspan fill="#f7768e">✦</tspan>
      <tspan fill="#bb9af7">      ·      </tspan>
      <tspan fill="#7dcfff">✧</tspan>
      <tspan fill="#9ece6a">      ·      </tspan>
      <tspan fill="#f7768e">✦</tspan>
    </text>
  </g>

  <text x="80" y="1395" xml:space="preserve"><tspan fill="#9ece6a" font-size="18">&gt;</tspan><tspan class="txt" font-size="16"> pinned repos below</tspan> <tspan class="mut" font-size="16">↓</tspan></text>
</svg>
