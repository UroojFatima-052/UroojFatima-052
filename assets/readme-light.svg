<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1420" width="900" height="1420" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace">
  <style>
    .txt { fill: #24292f; font-size: 16px; }
    .mut { fill: #6e7781; font-size: 16px; }
    .dot { fill: #d0d7de; font-size: 16px; }
    .kw { fill: #0969da; font-size: 16px; }
    .pur { fill: #8250df; font-size: 16px; }
    .pnk { fill: #d13487; font-size: 16px; }
    .gry { fill: #57606a; font-size: 16px; }
    .chip { font-size: 14px; font-weight: 500; }
  </style>

  <rect width="900" height="1420" rx="12" fill="#fbfcfd" stroke="#d0d7de" stroke-width="0.5"/>

  <text x="450" y="50" class="dot" text-anchor="middle">·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·</text>

  <g font-size="52" font-weight="500" text-anchor="middle">
    <text x="450" y="145">
      <tspan fill="#8250df">&gt;&gt;&gt;</tspan>
      <tspan fill="#cf222e"> import</tspan>
      <tspan fill="#24292f"> self</tspan>
    </text>
  </g>
  <text x="450" y="195" font-size="20" fill="#6e7781" text-anchor="middle" font-style="italic">a python developer, self-imported</text>

  <text x="450" y="240" class="dot" text-anchor="middle">·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·</text>

  <g xml:space="preserve">
    <text x="80" y="295" class="mut">/**</text>
    <text x="80" y="325"><tspan class="mut"> *   </tspan><tspan class="pnk">✿</tspan><tspan class="txt">  Glad you're here.</tspan></text>
    <text x="80" y="355" class="mut"> *</text>
    <text x="80" y="385"><tspan class="mut"> *      </tspan><tspan class="txt">I write code that tries to make small things</tspan></text>
    <text x="80" y="415"><tspan class="mut"> *      </tspan><tspan class="txt">a little better for the people who use them.</tspan></text>
    <text x="80" y="445"><tspan class="mut"> *      </tspan><tspan class="txt">Some of it lives on this profile. A lot of it</tspan></text>
    <text x="80" y="475"><tspan class="mut"> *      </tspan><tspan class="txt">doesn't — yet.</tspan></text>
    <text x="80" y="505" class="mut"> *</text>
    <text x="80" y="535"><tspan class="mut"> *      </tspan><tspan class="txt">If you build something, I'd love to see it.</tspan></text>
    <text x="80" y="565"><tspan class="mut"> *      </tspan><tspan class="txt">If you're stuck, tell me — I'll sit with you</tspan></text>
    <text x="80" y="595"><tspan class="mut"> *      </tspan><tspan class="txt">while we figure it out.</tspan></text>
    <text x="80" y="625" class="mut"> *</text>
    <text x="80" y="655"><tspan class="mut"> *   </tspan><tspan class="dot">─── ・ 。゚☆: *.☽ .* :☆゚. ───</tspan></text>
    <text x="80" y="685" class="mut"> *</text>
    <text x="80" y="715"><tspan class="mut"> *   </tspan><tspan class="kw">@dependencies</tspan></text>
    <text x="80" y="745" class="mut"> *</text>
  </g>

  <text x="80" y="775" xml:space="preserve"><tspan class="mut"> *   </tspan><tspan class="pur">◆  languages</tspan></text>
  <g transform="translate(150, 790)">
    <rect x="0" y="0" width="72" height="26" rx="5" fill="#fff8c5"/>
    <text x="36" y="18" fill="#7d4e00" text-anchor="middle" class="chip">python</text>
    <rect x="82" y="0" width="96" height="26" rx="5" fill="#fff1e5"/>
    <text x="130" y="18" fill="#953800" text-anchor="middle" class="chip">javascript</text>
    <rect x="188" y="0" width="46" height="26" rx="5" fill="#ddf4ff"/>
    <text x="211" y="18" fill="#0969da" text-anchor="middle" class="chip">sql</text>
  </g>

  <text x="80" y="850" xml:space="preserve"><tspan class="mut"> *   </tspan><tspan class="kw">◆  backend</tspan></text>
  <g transform="translate(150, 865)">
    <rect x="0" y="0" width="60" height="26" rx="5" fill="#ddf4ff"/>
    <text x="30" y="18" fill="#0969da" text-anchor="middle" class="chip">flask</text>
    <rect x="70" y="0" width="76" height="26" rx="5" fill="#ddf4ff"/>
    <text x="108" y="18" fill="#0969da" text-anchor="middle" class="chip">fastapi</text>
    <rect x="156" y="0" width="90" height="26" rx="5" fill="#ddf4ff"/>
    <text x="201" y="18" fill="#0969da" text-anchor="middle" class="chip">rest apis</text>
  </g>

  <text x="80" y="925" xml:space="preserve"><tspan class="mut"> *   </tspan><tspan class="pnk">◆  ai / ml</tspan></text>
  <g transform="translate(150, 940)">
    <rect x="0" y="0" width="108" height="26" rx="5" fill="#ffeff7"/>
    <text x="54" y="18" fill="#a4133c" text-anchor="middle" class="chip">scikit-learn</text>
    <rect x="118" y="0" width="76" height="26" rx="5" fill="#ffeff7"/>
    <text x="156" y="18" fill="#a4133c" text-anchor="middle" class="chip">pytorch</text>
    <rect x="204" y="0" width="104" height="26" rx="5" fill="#ffeff7"/>
    <text x="256" y="18" fill="#a4133c" text-anchor="middle" class="chip">huggingface</text>
  </g>

  <text x="80" y="1000" xml:space="preserve"><tspan class="mut"> *   </tspan><tspan class="gry">◆  tools</tspan></text>
  <g transform="translate(150, 1015)">
    <rect x="0" y="0" width="70" height="26" rx="5" fill="#eaeef2"/>
    <text x="35" y="18" fill="#57606a" text-anchor="middle" class="chip">vscode</text>
    <rect x="80" y="0" width="42" height="26" rx="5" fill="#eaeef2"/>
    <text x="101" y="18" fill="#57606a" text-anchor="middle" class="chip">git</text>
    <rect x="132" y="0" width="70" height="26" rx="5" fill="#eaeef2"/>
    <text x="167" y="18" fill="#57606a" text-anchor="middle" class="chip">docker</text>
    <rect x="212" y="0" width="58" height="26" rx="5" fill="#eaeef2"/>
    <text x="241" y="18" fill="#57606a" text-anchor="middle" class="chip">linux</text>
  </g>

  <g xml:space="preserve">
    <text x="80" y="1075" class="mut"> *</text>
    <text x="80" y="1105"><tspan class="mut"> *   </tspan><tspan class="dot">─── ・ 。゚☆: *.☽ .* :☆゚. ───</tspan></text>
    <text x="80" y="1135" class="mut"> *</text>
    <text x="80" y="1165"><tspan class="mut"> *   </tspan><tspan class="kw">@author  </tspan><tspan class="txt">   the person on the other side of this</tspan></text>
    <text x="80" y="1195"><tspan class="mut"> *   </tspan><tspan class="kw">@version </tspan><tspan class="txt">   still learning, always</tspan></text>
    <text x="80" y="1225"><tspan class="mut"> *   </tspan><tspan class="kw">@license </tspan><tspan class="txt">   be kind</tspan></text>
    <text x="80" y="1255" class="mut"> */</text>
  </g>

  <text x="450" y="1305" class="dot" text-anchor="middle">·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·</text>

  <g font-size="18" text-anchor="middle">
    <text x="450" y="1345">
      <tspan fill="#d13487">✦</tspan>
      <tspan fill="#8250df">      ·      </tspan>
      <tspan fill="#0969da">✧</tspan>
      <tspan fill="#1a7f37">      ·      </tspan>
      <tspan fill="#d13487">✦</tspan>
    </text>
  </g>

  <text x="80" y="1395" xml:space="preserve"><tspan fill="#1a7f37" font-size="18">&gt;</tspan><tspan class="txt" font-size="16"> pinned repos below</tspan> <tspan class="mut" font-size="16">↓</tspan></text>
</svg>
