<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace">
  <style>
    .txt { fill: #24292f; font-size: 14px; }
    .mut { fill: #6e7781; font-size: 14px; }
    .dot { fill: #d0d7de; font-size: 14px; }
    .kw { fill: #0969da; font-size: 14px; }
    .pur { fill: #8250df; font-size: 14px; }
    .pnk { fill: #d13487; font-size: 14px; }
    .grn { fill: #1a7f37; font-size: 14px; }
    .gry { fill: #57606a; font-size: 14px; }
    .code { font-size: 14px; }
  </style>

  <rect width="900" height="900" rx="12" fill="#fbfcfd" stroke="#d0d7de" stroke-width="0.5"/>

  <!-- top dots -->
  <text x="450" y="40" class="dot" text-anchor="middle">·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·</text>

  <!-- ASCII wordmark: import self -->
  <g xml:space="preserve" font-size="14">
    <text x="450" y="80" text-anchor="middle"><tspan fill="#cf222e">  _                            _              </tspan><tspan fill="#8250df">           _  __</tspan></text>
    <text x="450" y="100" text-anchor="middle"><tspan fill="#cf222e"> (_)_ __ ___  _ __   ___  _ __| |_            </tspan><tspan fill="#8250df">   ___  ___| |/ _|</tspan></text>
    <text x="450" y="120" text-anchor="middle"><tspan fill="#cf222e"> | | '_ ` _ \| '_ \ / _ \| '__| __|            </tspan><tspan fill="#8250df">  / __|/ _ \ | |_ </tspan></text>
    <text x="450" y="140" text-anchor="middle"><tspan fill="#cf222e"> | | | | | | | |_) | (_) | |  | |_             </tspan><tspan fill="#8250df">  \__ \  __/ |  _|</tspan></text>
    <text x="450" y="160" text-anchor="middle"><tspan fill="#cf222e"> |_|_| |_| |_| .__/ \___/|_|   \__|            </tspan><tspan fill="#8250df">  |___/\___|_|_|  </tspan></text>
    <text x="450" y="180" text-anchor="middle"><tspan fill="#cf222e">             |_|                              </tspan></text>
  </g>

  <text x="450" y="215" class="dot" text-anchor="middle">·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·  ·</text>

  <!-- comment block -->
  <g xml:space="preserve">
    <text x="60" y="260" class="mut">/**</text>
    <text x="60" y="285"><tspan class="mut"> *   </tspan><tspan class="pnk">✿</tspan><tspan class="txt">  Glad you're here.</tspan></text>
    <text x="60" y="305" class="mut"> *</text>
    <text x="60" y="325"><tspan class="mut"> *      </tspan><tspan class="txt">I write code that tries to make small things</tspan></text>
    <text x="60" y="345"><tspan class="mut"> *      </tspan><tspan class="txt">a little better for the people who use them.</tspan></text>
    <text x="60" y="365"><tspan class="mut"> *      </tspan><tspan class="txt">Some of it lives on this profile. A lot of it</tspan></text>
    <text x="60" y="385"><tspan class="mut"> *      </tspan><tspan class="txt">doesn't — yet.</tspan></text>
    <text x="60" y="405" class="mut"> *</text>
    <text x="60" y="425"><tspan class="mut"> *      </tspan><tspan class="txt">If you build something, I'd love to see it.</tspan></text>
    <text x="60" y="445"><tspan class="mut"> *      </tspan><tspan class="txt">If you're stuck, tell me — I might not know</tspan></text>
    <text x="60" y="465"><tspan class="mut"> *      </tspan><tspan class="txt">the answer but I'll sit with you while we</tspan></text>
    <text x="60" y="485"><tspan class="mut"> *      </tspan><tspan class="txt">figure it out.</tspan></text>
    <text x="60" y="505" class="mut"> *</text>
    <text x="60" y="525"><tspan class="mut"> *   </tspan><tspan class="dot">─── ・ 。゚☆: *.☽ .* :☆゚. ───</tspan></text>
    <text x="60" y="545" class="mut"> *</text>
    <text x="60" y="565"><tspan class="mut"> *   </tspan><tspan class="kw">@dependencies</tspan></text>
    <text x="60" y="585" class="mut"> *</text>

    <!-- languages -->
    <text x="60" y="605"><tspan class="mut"> *   </tspan><tspan class="pur">◆</tspan><tspan class="pur">  languages</tspan></text>
    <text x="60" y="628" class="mut"> *      </text>
    <rect x="120" y="614" width="52" height="18" rx="4" fill="#fff8c5"/>
    <text x="146" y="628" fill="#7d4e00" text-anchor="middle">python</text>
    <rect x="180" y="614" width="72" height="18" rx="4" fill="#fff1e5"/>
    <text x="216" y="628" fill="#953800" text-anchor="middle">javascript</text>
    <rect x="260" y="614" width="32" height="18" rx="4" fill="#ddf4ff"/>
    <text x="276" y="628" fill="#0969da" text-anchor="middle">sql</text>

    <text x="60" y="655" class="mut"> *</text>

    <!-- backend -->
    <text x="60" y="675"><tspan class="mut"> *   </tspan><tspan class="kw">◆</tspan><tspan class="kw">  backend</tspan></text>
    <rect x="120" y="684" width="44" height="18" rx="4" fill="#ddf4ff"/>
    <text x="142" y="698" fill="#0969da" text-anchor="middle">flask</text>
    <rect x="172" y="684" width="58" height="18" rx="4" fill="#ddf4ff"/>
    <text x="201" y="698" fill="#0969da" text-anchor="middle">fastapi</text>
    <rect x="238" y="684" width="70" height="18" rx="4" fill="#ddf4ff"/>
    <text x="273" y="698" fill="#0969da" text-anchor="middle">rest apis</text>

    <text x="60" y="725" class="mut"> *</text>

    <!-- ai / ml -->
    <text x="60" y="745"><tspan class="mut"> *   </tspan><tspan class="pnk">◆</tspan><tspan class="pnk">  ai / ml</tspan></text>
    <rect x="120" y="754" width="88" height="18" rx="4" fill="#ffeff7"/>
    <text x="164" y="768" fill="#a4133c" text-anchor="middle">scikit-learn</text>
    <rect x="216" y="754" width="60" height="18" rx="4" fill="#ffeff7"/>
    <text x="246" y="768" fill="#a4133c" text-anchor="middle">pytorch</text>
    <rect x="284" y="754" width="88" height="18" rx="4" fill="#ffeff7"/>
    <text x="328" y="768" fill="#a4133c" text-anchor="middle">huggingface</text>

    <text x="60" y="795" class="mut"> *</text>

    <!-- tools -->
    <text x="60" y="815"><tspan class="mut"> *   </tspan><tspan class="gry">◆</tspan><tspan class="gry">  tools</tspan></text>
    <rect x="120" y="824" width="52" height="18" rx="4" fill="#eaeef2"/>
    <text x="146" y="838" fill="#57606a" text-anchor="middle">vscode</text>
    <rect x="180" y="824" width="28" height="18" rx="4" fill="#eaeef2"/>
    <text x="194" y="838" fill="#57606a" text-anchor="middle">git</text>
    <rect x="216" y="824" width="52" height="18" rx="4" fill="#eaeef2"/>
    <text x="242" y="838" fill="#57606a" text-anchor="middle">docker</text>
    <rect x="276" y="824" width="44" height="18" rx="4" fill="#eaeef2"/>
    <text x="298" y="838" fill="#57606a" text-anchor="middle">linux</text>

    <text x="60" y="860" class="mut"> *</text>
    <text x="60" y="880"><tspan class="mut"> *   </tspan><tspan class="kw">@author</tspan><tspan class="txt">      the person on the other side of this</tspan></text>
    <text x="60" y="900"><tspan class="mut"> *   </tspan><tspan class="kw">@license</tspan><tspan class="txt">     be kind</tspan></text>
  </g>
</svg>
